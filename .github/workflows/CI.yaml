name: CI

on: [ push, pull_request ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: "true"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: latest
      - run: bun run task setup-without-playwright
      - run: bun run task lint-ci
      - run: bun run task lint-tsc-main
      - run: bun run task lint-tsc-lib
      - run: bun run task lint-tsc-lib-no-dom
      - run: bun run task lint-tsc-bin
      - run: bun run task lint-import-restrictions
      - run: bun run task check-schemas
      - run: bun run task check-for-duplicate-dependencies
      - run: bun run task format # note: not in `test-src` in `package.json`, only in CI
      - run: bun run task clean
      - run: bun run task reset # Should work the first time.
      - run: bun run task reset # Should work the second time (after deps are removed).

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: "true"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: latest
      - run: bun run task setup-without-playwright
      - run: bun run task build-lib-js
      - run: bun run task build-bin
      - run: bun run task build-lib-types
      - run: bun run task build-sites
      - run: bun run task build-site-docs
      - run: bun run task clean

  test-src:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: "true"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: latest
      - run: bun run task setup
      - run: bun run task test-ts-bun-with-coverage
      - run: bun run task test-ts-dom-with-coverage

  test-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: "true"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: latest
      - run: bun run task setup
      - run: bun run task build-lib-js
      - run: bun run task test-dist-lib-node-import
      - run: bun run task test-dist-lib-node-scramble
      - run: bun run task test-dist-lib-node-scramble-all-events
      - run: bun run task test-dist-lib-perf
      - run: bun run task test-dist-lib-plain-esbuild-compat
      - run: bun run task test-dist-lib-build-size
      - run: bun run task build-bin
      - run: bun run task test-dist-bin
      - run: bun run task build-sites
      - run: bun run task test-dist-sites-twizzle
      - run: bun run task check-package.json
      - run: bun run task clean

  test-dist-with-min-engine-versions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: "true"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.3.0
      - run: bun run task setup-without-playwright
      - run: bun run task build-lib-js
      - run: bun run task test-dist-lib-node-import
      - run: bun run task test-dist-lib-node-scramble
      - run: bun run task test-dist-lib-node-scramble-all-events
      - run: bun run task clean

  check-fast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: "true"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: latest
      - run: bun run task setup-without-playwright
      - run: time bun run task check-fast
